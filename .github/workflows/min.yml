name: Build txdcompress for ARM64

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ARM64 Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu

      - name: Compile txdcompress Statically
        run: |
          cd tools/modelsets
          aarch64-linux-gnu-g++ -O2 -static -o txdcompress txdcompress.cpp

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: txdcompress-aarch64
          path: tools/modelsets/txdcompress
